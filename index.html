<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 타로 리딩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 메인 화면 -->
    <div id="main-screen" class="screen">
        <h1>AI 타로 리딩</h1>
        <img src="images/shuffling.gif" id="shuffle-image" alt="카드를 셔플합니다.">
    </div>

    <!-- 2. 질문 방식 선택 대화상자 -->
    <div id="question-dialog" class="dialog hidden">
        <p>질문을 어떻게 하시겠어요?</p>
        <button id="write-question-btn">질문을 글로 적기</button>
        <button id="mind-question-btn">마음속으로 생각하기</button>
    </div>

    <!-- 3. 질문 입력 화면 (포커스 타로) -->
    <div id="focus-tarot-screen" class="screen hidden">
        <textarea id="question-input" placeholder="여기에 질문을 입력하세요..."></textarea>
        <button id="start-focus-reading-btn">카드 선택하기</button>
    </div>

    <!-- 4. 카드 선택 화면 -->
    <div id="card-select-screen" class="screen hidden">
        <p id="select-instruction">4장의 카드를 선택하세요. (남은 카드: 4장)</p>
        <img src="images/shuffling.gif" id="shuffle-for-select" alt="카드를 선택하세요.">
        <div id="selected-cards-preview">
            <!-- 선택된 카드가 여기에 표시됩니다 -->
        </div>
    </div>
    
    <!-- 5. 결과 보기 화면 -->
    <div id="result-screen" class="screen hidden">
        <div class="card-display">
            <img id="result-card-image" src="" alt="선택된 카드">
            <div id="interpretation-text"></div>
        </div>
        <div class="navigation-buttons">
            <button id="redo-btn">다시하기</button>
            <button id="prev-btn">이전</button>
            <button id="next-btn">다음</button>
            <button id="summary-btn">총정리 보기</button>
        </div>
    </div>
    
    <!-- 오디오 요소 -->
    <audio id="select-sound" src="sounds/select.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
